  const first=mo.querySelector("button");if(first)first.focus();
}
function renderToast(){let t=document.getElementById("toast");if(!S.ui.toast){if(t)t.remove();return;}if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=S.ui.toast;}

/* ---------- events ---------- */
function readDraft(){
  const f=document.getElementById("giftForm"); if(!f)return; const d=S.ui.draft;
  const nm=f.querySelector("#f-name"); if(nm)d.name=nm.value.trim();
  const pin=f.querySelector("#f-pin"); if(pin)d.pin=pin.value.trim();
  d.title=f.querySelector("#f-title").value.trim(); d.link=f.querySelector("#f-link").value.trim();
  ["country","store","pattern","color","size","avatar"].forEach(n=>{const r=f.querySelector(`input[name="${n}"]:checked`);if(r)d[n]=r.value;});
}
function validDraft(isJoin){const d=S.ui.draft;
  if(isJoin){
    if(!d.name)return "Add your name.";
    if(!/^\d{4,8}$/.test(d.pin||""))return "Choose a PIN of 4 to 8 digits.";
    if(Object.values(S.players).some(p=>(p.name||"").trim().toLowerCase()===d.name.toLowerCase()))return "Someone called "+d.name+" has already joined. If that's you, sign in instead.";
  }
  if(!d.title)return "Say what the gift is.";
  if(d.link&&!safeUrl(d.link))return "That link doesn't look right. It should start with https://";
  return "";}
function bind(){
  const app=document.getElementById("app");
  app.querySelectorAll("[data-parcel]").forEach(b=>b.addEventListener("click",()=>{audio();clickParcel(b.getAttribute("data-parcel"));}));
  app.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>removePlayer(b.getAttribute("data-remove"))));
  app.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{S.ui.editing=b.getAttribute("data-edit");S.ui.draft=null;S.ui.saved="";render();}));
  app.querySelectorAll("[data-delgift]").forEach(b=>b.addEventListener("click",()=>removeGift(b.getAttribute("data-delgift"))));
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>{if(b.tagName==="A")e.preventDefault();act(b.getAttribute("data-act"));}));
  const f=document.getElementById("giftForm");
  if(f){
    const ap=f.querySelector("#f-aphoto"); if(ap)ap.addEventListener("change",async()=>{const file=ap.files&&ap.files[0];if(!file)return;try{readDraft();S.ui.draft.aphoto=await squarePhoto(file,120);render();}catch(err){toast(err.message);}});
    f.addEventListener("input",e=>{if(e.target.id==="f-aphoto")return;if(e.target.name==="avatar"&&S.ui.draft)S.ui.draft.aphoto="";readDraft();if(e.target.type==="radio"){render();}else{const pv=document.querySelector(".preview");if(pv)pv.innerHTML=parcelHTML("preview",S.ui.draft,{static:true,label:"Preview of your parcel"});}});
    f.addEventListener("submit",e=>{e.preventDefault();saveGift();});
    const ph=f.querySelector("#f-photo");
    ph.addEventListener("change",async()=>{const file=ph.files&&ph.files[0];if(!file)return;try{readDraft();S.ui.draft.photo=await shrinkPhoto(file,320,.72);render();}catch(err){toast(err.message);}});
  }
  const pf=document.getElementById("profileForm"); if(pf)pf.addEventListener("change",async e=>{
    if(e.target.name==="pcountry")saveProfile({country:e.target.value});
    else if(e.target.name==="pavatar")saveProfile({avatar:e.target.value,photo:null});
    else if(e.target.id==="p-photo"){const file=e.target.files&&e.target.files[0];if(!file)return;try{saveProfile({photo:await squarePhoto(file,120)});}catch(err){toast(err.message);}}
  });
  const sf=document.getElementById("signinForm"); if(sf)sf.addEventListener("submit",e=>{e.preventDefault();signIn();});
  const uf=document.getElementById("unlockForm"); if(uf)uf.addEventListener("submit",e=>{e.preventDefault();unlock();});
  const cf=document.getElementById("createForm"); if(cf)cf.addEventListener("submit",e=>{e.preventDefault();createGame();});
  const kf=document.getElementById("claimForm"); if(kf)kf.addEventListener("submit",e=>{e.preventDefault();claimHost();});
  const da=document.getElementById("demoAs"); if(da)da.addEventListener("change",()=>{S.me=da.value;S.ui.draft=null;S.ui.editing=null;render();});
  ["budget","minMin","maxMin","min2","max2"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>setSetting(id,id==="budget"?el.value.trim().slice(0,30):Math.max(1,Math.min(60,+el.value||5))));});
  const pl=document.getElementById("passLeft"); if(pl)pl.addEventListener("change",()=>setSetting("passLeft",pl.checked));
  const fa=document.getElementById("freezeAfter"); if(fa)fa.addEventListener("change",()=>setSetting("freezeAfter",+fa.value||0));
  const nb=document.getElementById("noStealBack"); if(nb)nb.addEventListener("change",()=>setSetting("noStealBack",nb.checked));
}
async function copyText(t,ok){try{await navigator.clipboard.writeText(t);toast(ok);}catch(e){toast("Couldn't copy. Select the text and copy it instead.");}}
function act(a){
  audio();
  if(a==="roll")roll();
  else if(a==="start")startGame();
  else if(a==="steal")startSteal();
  else if(a==="end1")endPhase("steal",false);
  else if(a==="round3")startRound3();
  else if(a==="unwrap")startUnwrap();
  else if(a==="openrest")openRest();
  else if(a==="end2")endPhase("steal2",false);
  else if(a==="skip")skipTurn();
  else if(a==="peek"){S.ui.showTime=!S.ui.showTime;render();}
  else if(a==="new")newGame();
  else if(a==="copylink")copyText(pageLink(),"Link copied. Send it to everyone with the game PIN!");
  else if(a==="copymine")copyText(myText(),"Copied your shopping list.");
  else if(a==="signout")signOut();
  else if(a==="leaveask"){S.ui.confirmLeave=true;render();}
  else if(a==="leavecancel"){S.ui.confirmLeave=false;render();}
  else if(a==="leave"){S.ui.confirmLeave=false;signOut();}
  else if(a==="setgpin")setGamePin();
  else if(a==="showcreate"){S.ui.showCreate=true;render();}
  else if(a==="joinsignin"){S.ui.joinMode="signin";render();}
  else if(a==="joinnew"){S.ui.joinMode="new";render();}
  else if(a==="addgift"){S.ui.editing="new";S.ui.draft=null;S.ui.saved="";render();}
  else if(a==="clearhistory")clearHistory();
  else if(a==="wipeask"){S.ui.confirmWipe=true;render();}
  else if(a==="wipecancel"){S.ui.confirmWipe=false;render();}
  else if(a==="wipe")wipeAll();
  else if(a==="clearaphoto"){if(S.ui.draft){S.ui.draft.aphoto="";render();}}
  else if(a==="clearpphoto")saveProfile({photo:null});
  else if(a==="canceledit"){S.ui.editing=null;S.ui.draft=null;render();}
}

/* ---------- saving ---------- */
function newId(){return S.local?"g"+Date.now()+Math.floor(Math.random()*1000):doc(collection(S.fs,"parcels")).id;}
async function saveGift(){
  readDraft(); const m=me(), isJoin=!m; const err=validDraft(isJoin); if(err){toast(err);return;}
  const d=S.ui.draft, editing=S.ui.editing;
  const gid=(!isJoin&&editing&&editing!=="new")?editing:newId();
  const pid=m||newId();
  const parcel={owner:pid,pattern:PATTERNS[d.pattern]?d.pattern:"stripes",color:COLORS[d.color]?d.color:"red",size:SIZES[d.size]?d.size:"m",createdAt:S.parcels[gid]?S.parcels[gid].createdAt:Date.now()};
  const content={owner:pid,title:d.title.slice(0,120),link:safeUrl(d.link||"")};
  if(typeof d.photo==="string"&&/^data:image\/jpeg;base64,/.test(d.photo)&&d.photo.length<300000)content.photo=d.photo;
  const player=isJoin?{name:d.name.slice(0,40),country:COUNTRY[d.country]?d.country:"uk",avatar:AV_BG[d.avatar]?d.avatar:AVATARS[0][0],createdAt:Date.now()}:null;
  if(player&&typeof d.aphoto==="string"&&/^data:image\/jpeg;base64,/.test(d.aphoto)&&d.aphoto.length<60000)player.photo=d.aphoto;
  const msg=isJoin?"You're in! Your parcel is on the table. You can add more gifts below.":editing==="new"?"Gift added! It's another parcel in the middle.":"Saved your changes.";
  if(S.local){if(player){S.players[pid]=player;S.me=pid;}S.parcels[gid]=parcel;S.contents[gid]=content;S.ui.saved=msg;S.ui.draft=null;S.ui.editing=null;render();return;}
  S.ui.saving=true;render();
  try{
    const b=writeBatch(S.fs);
    if(isJoin){
      b.set(doc(S.fs,"seats",S.uid),{player:pid,pin:d.pin});
      b.set(doc(S.fs,"playerSecrets",pid),{pin:d.pin});
      b.set(doc(S.fs,"players",pid),player);
    }
    b.set(doc(S.fs,"parcels",gid),parcel);
    b.set(doc(S.fs,"contents",gid),content);
    await b.commit();
    S.contents[gid]=content; S.ui.saved=msg; S.ui.draft=null; S.ui.editing=null;
  }catch(e){toast(e&&e.code==="permission-denied"?"Gifts are locked now that the game has started.":"Couldn't save just now. Check your connection and try again.");}
  S.ui.saving=false;render();
}
async function saveProfile(patch){
  const m=me(); if(!m)return;
  if(patch.country&&!COUNTRY[patch.country])return;
  const next=Object.assign({},S.players[m],patch); if(!next.photo)delete next.photo;
  if(S.local){S.players[m]=next;render();return;}
  try{await setDoc(doc(S.fs,"players",m),next);toast("Saved.");}catch(e){toast(e&&e.code==="permission-denied"?"Profiles are locked once the game starts.":"Couldn't save that. Try again.");}
}
async function removeGift(gid){
  if(S.local){delete S.parcels[gid];delete S.contents[gid];render();return;}
  try{const b=writeBatch(S.fs);b.delete(doc(S.fs,"parcels",gid));b.delete(doc(S.fs,"contents",gid));await b.commit();toast("Gift removed.");}catch(e){toast("Couldn't remove it.");}
}
async function signIn(){
  const who=document.getElementById("s-who").value, pin=document.getElementById("s-pin").value.trim();
  if(!who){toast("Choose your name.");return;} if(!pin){toast("Enter your PIN.");return;}
  try{await setDoc(doc(S.fs,"seats",S.uid),{player:who,pin:pin});toast("Hi "+nameOf(who)+"!");location.hash="#table";}
  catch(e){toast("That PIN doesn't match. Try again.");}
}
async function signOut(){
  if(S.local)return;
  try{await deleteDoc(doc(S.fs,"seats",S.uid));S.ui.draft=null;S.ui.editing=null;S.ui.joinMode="signin";location.hash="#my-gifts";toast("You've left the game on this device. Sign in again any time.");}catch(e){toast("Couldn't leave just now. Try again.");}
}
async function removePlayer(pid){
  if(!S.isHost)return; const nm=nameOf(pid);
  const theirs=Object.keys(S.parcels).filter(x=>S.parcels[x].owner===pid);
  if(S.local){delete S.players[pid];theirs.forEach(x=>{delete S.parcels[x];delete S.contents[x];});render();return;}
  try{const b=writeBatch(S.fs);theirs.forEach(x=>{b.delete(doc(S.fs,"parcels",x));b.delete(doc(S.fs,"contents",x));});b.delete(doc(S.fs,"players",pid));await b.commit();toast("Removed "+nm+".");}catch(e){toast("Couldn't remove them.");}
}
async function unlock(){
  const code=(document.getElementById("u-code").value||"").trim(); if(!code){toast("Enter the game PIN.");return;}
  try{await setDoc(doc(S.fs,"access",S.uid),{code:code});toast("You're in!");subscribeAll();}
  catch(e){toast("That game PIN isn't right. Check with the host.");}
}
async function setGamePin(){
  if(!S.isHost)return; const el=document.getElementById("g-pin"); const code=(el&&el.value||"").trim();
  if(code.length<4){toast("Choose a game PIN with at least 4 characters.");return;}
  if(S.local){toast("Game PIN saved (demo).");return;}
  try{await setDoc(doc(S.fs,"secret","game"),{code:code});if(!S.game.settings.gamePin)await setSetting("gamePin",true);toast("Game PIN saved. Send it with the link!");el.value="";}
  catch(e){toast("Couldn't save the game PIN. Try again.");}
}
async function createGame(){
  const pin=(document.getElementById("c-pin").value||"").trim();
  const gpin=(document.getElementById("c-gpin").value||"").trim();
  const budget=(document.getElementById("c-budget").value||"").trim().slice(0,30)||"£20 / $25";
  if(pin.length<4){toast("Choose a host PIN with at least 4 characters.");return;}
  if(gpin.length<4){toast("Choose a game PIN with at least 4 characters.");return;}
  if(gpin===pin){toast("Make the game PIN different from your host PIN.");return;}
  const g=defaultGame(); g.settings.budget=budget; g.settings.gamePin=true; g.hostUid=S.uid;
  try{const b=writeBatch(S.fs);b.set(doc(S.fs,"state","main"),g);b.set(doc(S.fs,"secret","host"),{pin:pin,uid:S.uid});b.set(doc(S.fs,"secret","game"),{code:gpin});await b.commit();toast("Game created. You're the host! Now add your gifts.");S.ui.showCreate=false;location.hash="#my-gifts";if(S.locked)subscribeAll();}
  catch(e){toast("The game has already been set up. Use the host PIN instead.");}
}
async function claimHost(){
  const pin=(document.getElementById("claim-pin").value||"").trim(); if(!pin){toast("Enter the host PIN.");return;}
  try{await setDoc(doc(S.fs,"hosts",S.uid),{pin:pin});toast("You're the host on this device now.");location.hash="#table";if(S.locked)subscribeAll();}
  catch(e){toast("That PIN isn't right.");}
}

/* ---------- falling snow ---------- */
(function snow(){
  const c=document.getElementById("snow"); if(!c)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const x=c.getContext("2d"); let W,H,flakes=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;const n=Math.round(Math.min(110,W*H/14000));flakes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.8,s:Math.random()*.6+.25,d:Math.random()*Math.PI*2}));}
  size(); addEventListener("resize",size);
  (function frame(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.75)";
    flakes.forEach(f=>{f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.3;if(f.y>H+4){f.y=-4;f.x=Math.random()*W;}x.beginPath();x.arc(f.x,f.y,f.r,0,Math.PI*2);x.fill();});
    requestAnimationFrame(frame);})();
})();

/* ---------- big moments ---------- */
let fxTimer=null;
function hideFx(){const l=document.getElementById("fxlayer");if(l)l.remove();clearTimeout(fxTimer);}
function showFx(fx){
  hideFx(); if(!fx)return;
  const m=me(), g=S.game, isMe=fx.by&&fx.by===m;
  let html="", hold=2600, party=false, six=false;
  if(fx.kind==="roll"){
    six=fx.n===6;
    const nm=isMe?"You":esc(nameOf(fx.by));
    let sub="";
    if(six)sub=fx.phase==="grab"?(isMe?"Pick a parcel from the middle!":"They get to pick a parcel!"):(isMe?"Time to steal!":"Hide your gifts…");
    else if(fx.pass)sub="Everyone passes their gifts to the next person! 🔄";
    else sub=isMe?"Better luck next time.":"";
    html=`<div class="who">${avatarHTML(fx.by,"lg")}</div><div id="fxdie">${dieHTML(1).replace('id="die"',"")}</div><h2 id="fxtitle" style="visibility:hidden">${nm} rolled a ${fx.n}${six?"!":"."}</h2>${sub?`<p class="sub" id="fxsub" style="visibility:hidden">${sub}</p>`:""}`;
    hold=six||fx.pass?3000:1900; party=six;
  }else if(fx.kind==="steal"){
    const what=g.opened[fx.gid]&&S.contents[fx.gid]&&S.contents[fx.gid].title?"“"+esc(S.contents[fx.gid].title)+"”":"parcel "+numOf(g,fx.gid);
    const thief=fx.by===m?"You":esc(nameOf(fx.by)), victim=fx.from===m?"you":esc(nameOf(fx.from));
    html=`<div class="who">${avatarHTML(fx.by,"xl")}<span style="font-size:2rem">➜</span>${avatarHTML(fx.from,"xl")}</div><h2>😱 ${thief} stole ${what} from ${victim}!</h2>${fx.froze?'<p class="sub">❄ It\'s now frozen and can\'t be stolen again this round.</p>':""}`;
    hold=3200; party=true;
  }else if(fx.kind==="open"){
    if(!S.contents[fx.gid]&&!S.local){getDoc(doc(S.fs,"contents",fx.gid)).then(sn=>{if(sn.exists()){S.contents[fx.gid]=sn.data();if(S.game.fx&&S.game.fx.t===fx.t)showFx(fx);render();}}).catch(()=>{});return;}
    const who=fx.by===m?"You":esc(nameOf(fx.by));
    html=`<div class="who">${avatarHTML(fx.by,"lg")}<span>${who} opened…</span></div><div style="width:100%;max-width:340px;text-align:left">${giftCard(fx.gid)}</div>`;
    hold=2600; party=true;
  }else if(fx.kind==="phase"){
    const T={grab:["🎲 Round 1: Grab!",fx.by?esc(nameOf(fx.by))+" rolls first. Roll a 6 to pick a parcel.":""],steal:["😈 Round 2: Steal!","The hidden timer has started. Roll a 6 to steal."],keep:[(fx.auto?"⏰ Time's up! ":"")+"Round 2½","Open one of your parcels. That gift is safe."],unwrap:["🎁 Unwrap time!","Open the rest of your parcels and see what everyone's got."],steal2:["😈 Round 3: Steal!","A new hidden timer has started. Steal anything that isn't safe."],done:[(fx.auto?"⏰ Time's up! ":"")+"That's a wrap! 🎉","Check your shopping list and the awards."]}[fx.phase];
    if(!T)return;
    html=`<h2>${T[0]}</h2>${T[1]?`<p class="sub">${T[1]}</p>`:""}`; hold=fx.phase==="done"?4000:3000; party=fx.phase==="done"||fx.phase==="steal2";
  }
  const l=document.createElement("div");l.id="fxlayer";l.className="fxlayer";l.setAttribute("role","status");
  l.innerHTML=`<div class="fxcard${six?" six":""}">${html}<p class="hint">Tap to close</p></div>`;
  l.addEventListener("click",hideFx);document.body.appendChild(l);
  if(fx.kind==="roll"){
    const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;let k=reduce?0:9;
    const tick=()=>{const d=document.getElementById("fxdie");if(!d)return;if(k-->0){d.innerHTML=dieHTML(1+Math.floor(Math.random()*6)).replace('id="die"',"");setTimeout(tick,70);}else{d.innerHTML=dieHTML(fx.n).replace('id="die"',"");["fxtitle","fxsub"].forEach(id=>{const e=document.getElementById(id);if(e)e.style.visibility="visible";});if(party){confetti(160);chime([784,988,1175,1568]);}}};tick();
  }else if(party){confetti(fx.kind==="steal"||fx.kind==="open"?80:200);chime(fx.kind==="steal"?[523,659,784]:[784,988,1175,1568]);}
  fxTimer=setTimeout(hideFx,hold+(fx.kind==="roll"?650:0));
}
function confetti(n){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let c=document.getElementById("confetti");if(!c){c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);}
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d");
  const cols=["#eab84b","#e0525b","#7fd49b","#f7f1e6","#cfe0f5","#d2668a"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function frame(t){x.clearRect(0,0,W,H);let alive=false;ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y<H+20)alive=true;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(alive&&t-t0<4000)requestAnimationFrame(frame);else x.clearRect(0,0,W,H);})(t0);
}

/* ---------- awards ---------- */
function topOf(map){let best=0,who=[];Object.entries(map||{}).forEach(([k,v])=>{if(v>best){best=v;who=[k];}else if(v===best&&v>0)who.push(k);});return {n:best,who:best>0?who:[]};}
function awardsHTML(){
  const g=S.game, st=g.stats||emptyStats(), o=ordOf(g);
  const people=list=>list.map(pid=>`<span class="nmwrap">${avatarHTML(pid)}${esc(nameOf(pid))}</span>`).join(" ");
  const cards=[];
  const ms=topOf(st.giftSteals);
  if(ms.who.length)cards.push(["🏆","Most wanted gift",ms.who.map(gid=>"“"+esc(gift(gid).title||"A mystery gift")+"”").join(", "),"Stolen "+ms.n+" time"+(ms.n===1?"":"s")]);
  const th=topOf(st.stole); if(th.who.length)cards.push(["🦹","Biggest thief",people(th.who),th.n+" steal"+(th.n===1?"":"s")]);
  const rb=topOf(st.robbed); if(rb.who.length)cards.push(["😭","Most robbed",people(rb.who),"Lost "+rb.n+" gift"+(rb.n===1?"":"s")+" to thieves"]);
  const lk=topOf(st.sixes); if(lk.who.length)cards.push(["🍀","Luckiest roller",people(lk.who),lk.n+" six"+(lk.n===1?"":"es")]);
  const unl=o.map(pid=>[pid,(st.rolls[pid]||0)-(st.sixes[pid]||0)]); const ul=topOf(Object.fromEntries(unl));
  if(ul.who.length)cards.push(["🎲","Most rolls without a 6",people(ul.who),ul.n+" non-sixes"]);
  const haul=topOf(Object.fromEntries(o.map(pid=>[pid,heldOf(g,pid).length])));
  if(haul.who.length)cards.push(["🎁","Biggest haul",people(haul.who),"Went home with "+haul.n+" gift"+(haul.n===1?"":"s")]);
  const own=o.filter(pid=>heldOf(g,pid).some(x=>ownerOf(x)===pid));
  if(own.length)cards.push(["😇","Kept their own gift",people(own),"Great taste, clearly"]);
  const never=o.filter(pid=>!(st.stole[pid]||0)&&!(st.robbed[pid]||0));
  if(never.length&&never.length<o.length)cards.push(["🕊️","Peacekeeper",people(never),"Never stole, never robbed"]);
  if(!cards.length)return "";
  return `<section class="panel"><h2>Awards</h2><div class="awards">${cards.map(c=>`<div class="award"><div class="ic">${c[0]}</div><div class="ti">${c[1]}</div><div class="wn">${c[2]}</div><div class="hint">${c[3]}</div></div>`).join("")}</div></section>`;
}

/* ---------- reacting to changes ---------- */
function watchMine(){
  if(S.local)return;
  const want=new Set(myGifts());
  Object.keys(S.mineUnsubs).forEach(gid=>{if(!want.has(gid)){S.mineUnsubs[gid]();delete S.mineUnsubs[gid];}});
  want.forEach(gid=>{if(!S.mineUnsubs[gid])S.mineUnsubs[gid]=onSnapshot(doc(S.fs,"contents",gid),snap=>{if(snap.exists()){S.contents[gid]=snap.data();if(!editingForm())render();}},()=>{});});
}
function onGame(){
  const g=S.game;
  if(g.fx&&g.fx.t&&g.fx.t!==S.ui.lastFxT){const first=!S.ui.fxSeen;S.ui.lastFxT=g.fx.t;if(!first)setTimeout(()=>showFx(g.fx),0);}
  S.ui.fxSeen=true;
  if(g.last&&g.last.t&&g.last.t!==S.ui.lastRollT){const first=!S.ui.lastRollT;S.ui.lastRollT=g.last.t;if(first){S.ui.face=g.last.n;}else{setTimeout(()=>animateTo(g.last.n),0);}}
  if(!S.local)Object.keys(g.opened||{}).forEach(x=>{if(!S.contents[x]&&!S.fetching[x]&&S.parcels[x]){S.fetching[x]=true;getDoc(doc(S.fs,"contents",x)).then(s=>{if(s.exists()){S.contents[x]=s.data();render();}}).catch(()=>{}).finally(()=>{delete S.fetching[x];});}});
  watchMine();
  const m=me(), cur=curOf(g);
  const key=g.phase+"|"+(ROLL_PHASES.includes(g.phase)?g.turn+"|"+g.awaiting:"")+"|"+(g.phase==="keep"&&m&&!g.kept[m]&&heldOf(g,m).length?"k":"")+(g.phase==="unwrap"&&m&&unopenedOf(g,m).length?"u":"");
  const myMove=m&&((ROLL_PHASES.includes(g.phase)&&cur===m&&!(g.phase==="grab"&&g.grabDone))||(g.phase==="keep"&&!g.kept[m]&&heldOf(g,m).length)||(g.phase==="unwrap"&&unopenedOf(g,m).length));
  if(key!==S.ui.turnKey){S.ui.turnKey=key;if(myMove&&!g.awaiting)chime([660,880,1320]);}
  document.title=myMove?"🎲 Your turn! · Christmas Parcel Steal":"Christmas Parcel Steal";
  if(!(editingForm()&&view()==="my-gifts"&&g.phase==="setup"))render();
}

/* ---------- timer ---------- */
setInterval(()=>{
  const g=S.game; if(!g||(g.phase!=="steal"&&g.phase!=="steal2"))return;
  if(S.ui.showTime){const t=document.getElementById("timeleft");if(t)t.textContent=fmt(g.timerEnd-Date.now());}
  const key=g.phase+g.timerEnd;
  if(g.timerEnd&&Date.now()>=g.timerEnd&&S.ui.ending!==key&&(me()||S.isHost)){S.ui.ending=key;chime([1175,988,784,1568]);setTimeout(()=>endPhase(g.phase,true),Math.random()*800);}
},1000);
window.addEventListener("hashchange",()=>{S.ui.saved="";S.ui.editing=null;S.ui.draft=null;render();});

/* ---------- demo ---------- */
function loadDemo(){
  S.local=true;S.isHost=true;S.stateExists=true;
  const t=Date.now();
  [["Amy","uk","🦌"],["Gabs","uk","⛄"],["Sam","us","🐧"],["Priya","uk","🦊"],["Jo","us","🌟"]].forEach((p,i)=>{S.players["p"+i]={name:p[0],country:p[1],avatar:p[2],createdAt:t+i};});
  [[0,"Cosy cable-knit socks","uk","stripes","red","s"],[0,"Mini fairy-light bottle","uk","dots","gold","tall"],[1,"Mini waffle maker","uk","dots","green","l"],[2,"Glow-in-the-dark star map","us","check","blue","long"],[3,"Hot sauce sampler","uk","kraft","red","m"],[4,"Desk cactus that sings","us","confetti","pink","tall"],[4,"Novelty mug","us","plain","silver","m"]]
  .forEach((d,i)=>{const gid="g"+i;S.parcels[gid]={owner:"p"+d[0],pattern:d[3],color:d[4],size:d[5],createdAt:t+i};S.contents[gid]={owner:"p"+d[0],title:d[1],link:d[2]==="uk"?"https://www.amazon.co.uk/dp/demo":"https://www.amazon.com/dp/demo"};});
  S.me="p0";S.game=defaultGame();S.loaded=true;render();
}

/* ---------- boot ---------- */
function syncHost(){S.isHost=!!S.uid&&!!S.game&&(S.game.hostUid===S.uid||S.hostClaim);}
let unsubs=[], slowTimer=null;
function subscribeAll(){
  unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[];
  S.locked=false; S.loaded=false; S.ui.showCreate=false; render();
  let got={state:false,players:false,parcels:false,seat:false},denied=false;
  const ready=()=>{if(!denied&&Object.values(got).every(Boolean)&&!S.loaded){S.loaded=true;clearTimeout(slowTimer);onGame();}};
  const after=()=>{if(S.loaded&&!S.locked)onGame();else ready();};
  const lock=e=>{if(e&&e.code==="permission-denied"&&!denied){denied=true;S.locked=true;S.loaded=true;clearTimeout(slowTimer);render();}};
  unsubs.push(onSnapshot(doc(S.fs,"state","main"),snap=>{
    got.state=true; S.stateExists=snap.exists();
    const prevPhase=S.game&&S.game.phase;
    S.game=normalize(snap.exists()?snap.data():null);
    if(prevPhase&&prevPhase!=="setup"&&S.game.phase==="setup"){const keepC={};myGifts().forEach(x=>{if(S.contents[x])keepC[x]=S.contents[x];});S.contents=keepC;}
    syncHost(); after();
  },e=>{if(e&&e.code==="permission-denied")lock(e);else toast("Lost connection to the table. Refresh the page.");}));
  unsubs.push(onSnapshot(collection(S.fs,"players"),snap=>{const m={};snap.forEach(d=>{m[d.id]=d.data();});S.players=m;got.players=true;after();},e=>{lock(e);got.players=true;ready();}));
  unsubs.push(onSnapshot(collection(S.fs,"parcels"),snap=>{const m={};snap.forEach(d=>{m[d.id]=d.data();});S.parcels=m;got.parcels=true;after();},e=>{lock(e);got.parcels=true;ready();}));
  unsubs.push(onSnapshot(doc(S.fs,"seats",S.uid),snap=>{
    const p=snap.exists()?snap.data().player:null; got.seat=true;
    if(p!==S.me){S.me=p;S.ui.draft=null;S.ui.editing=null;}
    after();
  },()=>{got.seat=true;ready();}));
  unsubs.push(onSnapshot(doc(S.fs,"hosts",S.uid),snap=>{S.hostClaim=snap.exists();syncHost();if(S.loaded&&!S.locked)render();},()=>{}));
}
function boot(){
  if(new URLSearchParams(location.search).has("demo")||!firebaseConfig.apiKey){loadDemo();return;}
  const app=initializeApp(firebaseConfig); const auth=getAuth(app); S.fs=getFirestore(app);
  slowTimer=setTimeout(()=>{if(!S.loaded){document.getElementById("app").innerHTML=`<p class="sub">Still connecting… If this doesn't load, check your internet connection and refresh.</p>`;}},10000);
  signInAnonymously(auth).catch(()=>{document.getElementById("app").innerHTML=`<p class="sub">Couldn't connect to the game. Refresh the page to try again.</p>`;});
  let started=false;
  onAuthStateChanged(auth,user=>{if(!user||started)return;started=true;S.uid=user.uid;subscribeAll();});
}
boot();
</script>
