<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Parcel Steal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: a green card-table felt under warm lamp light. Single theme by choice. */
  --felt:#123b2e; --felt-deep:#0a2a1f; --card:#18483a; --line:#2c6150;
  --ink:#f7f1e6; --muted:#b4c8bd; --gold:#eab84b; --berry:#e0525b; --ok:#7fd49b;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Layout: tabs → table (the middle + seats) with a dice rail; stacks to one column on phones */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%, #1d5a45 0%, var(--felt) 45%, var(--felt-deep) 100%) fixed;background-color:var(--felt-deep);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 64px;display:grid;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:.95rem}
nav.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:999px}
nav.tabs a{text-decoration:none;color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--felt-deep)}
.banner{background:rgba(234,184,75,.12);border:1px solid rgba(234,184,75,.45);padding:10px 14px;border-radius:12px;font-size:.93rem}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--gold);color:#2a1b02}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--berry);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.pill.live{background:rgba(224,82,91,.18);border-color:rgba(224,82,91,.6)}
.pill.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--berry);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* table layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:1fr}}
.middle{min-height:170px;border-radius:22px;padding:18px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 4px),rgba(0,0,0,.22);border:2px dashed rgba(255,255,255,.12);display:grid;gap:10px}
.middle .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pile{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;min-height:96px}
.empty{color:var(--muted);font-style:italic;font-size:.93rem}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.seat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start;transition:box-shadow .2s, border-color .2s}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(234,184,75,.25)}
.seat .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.seat .count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:.85rem}
.seat .pile{min-height:70px;gap:10px}
.turnflag{font-size:.72rem;background:var(--gold);color:#2a1b02;padding:2px 8px;border-radius:999px;font-weight:800;text-transform:uppercase}

/* parcels */
.parcel{position:relative;border:0;padding:0;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.3);transition:transform .15s;flex:none}
.parcel:hover{transform:translateY(-3px) rotate(-1deg)}
.parcel.static{cursor:default}
.parcel.static:hover{transform:none}
.parcel.target{animation:wiggle 1s infinite}
@keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.parcel .rv,.parcel .rh{position:absolute;background:var(--rib)}
.parcel .rv{top:0;bottom:0;left:50%;width:10px;transform:translateX(-50%)}
.parcel .rh{left:0;right:0;top:50%;height:10px;transform:translateY(-50%)}
.parcel .bow{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:34px;height:18px}
.parcel .bow::before,.parcel .bow::after{content:"";position:absolute;top:0;width:16px;height:16px;border:4px solid var(--rib);border-radius:50% 50% 50% 0}
.parcel .bow::before{left:0;transform:rotate(-30deg)}
.parcel .bow::after{right:0;transform:scaleX(-1) rotate(-30deg)}
.parcel .tag{position:absolute;right:-8px;bottom:-8px;background:#f7f1e6;color:#3a2a14;font:800 .75rem/1 var(--display);padding:4px 6px;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.sz-s{width:58px;height:50px}.sz-m{width:78px;height:64px}.sz-l{width:100px;height:80px}.sz-long{width:118px;height:46px}.sz-tall{width:58px;height:92px}
.mini .sz-s{width:44px;height:38px}.mini .sz-m{width:56px;height:46px}.mini .sz-l{width:70px;height:56px}.mini .sz-long{width:82px;height:34px}.mini .sz-tall{width:42px;height:66px}
.mini .parcel .rv{width:7px}.mini .parcel .rh{height:7px}.mini .parcel .bow{transform:translateX(-50%) scale(.75);top:-10px}
.pat-stripes{background:repeating-linear-gradient(45deg,var(--c1) 0 9px,var(--c2) 9px 18px)}
.pat-dots{background:radial-gradient(var(--c2) 22%,transparent 25%) 0 0/14px 14px,var(--c1)}
.pat-check{background:conic-gradient(var(--c2) 25%,var(--c1) 0 50%,var(--c2) 0 75%,var(--c1) 0) 0 0/18px 18px}
.pat-confetti{background:radial-gradient(circle at 30% 30%,var(--c2) 9%,transparent 11%) 0 0/16px 16px,radial-gradient(circle at 70% 70%,var(--rib) 7%,transparent 9%) 0 0/16px 16px,var(--c1)}
.pat-plain{background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 55%),var(--c1)}
.pat-kraft{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),#b98858}
.pat-kraft .rv,.pat-kraft .rh{background:#f3ead8;width:4px}
.pat-kraft .rh{width:auto;height:4px}

/* opened gift */
.gift{width:100%;background:#f7f1e6;color:#2b2318;border-radius:14px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;animation:pop .45s ease-out}
.gift img,.gift .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#e8dcc6;display:grid;place-items:center;font:800 1.4rem var(--display);color:#9b7b52}
.gift .t{font-weight:700;line-height:1.25}
.gift .m{font-size:.8rem;color:#6b5b45}
.gift a{color:#8a2430;font-weight:700;font-size:.85rem}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.05)}100%{transform:none;opacity:1}}

/* dice rail */
.rail{position:sticky;top:12px;display:grid;gap:12px}
.die{width:96px;height:96px;margin:4px auto;background:#fbf7ef;border-radius:20px;box-shadow:inset 0 -6px 0 #d9cfbd,0 8px 16px rgba(0,0,0,.35);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;gap:2px}
.die i{width:16px;height:16px;border-radius:50%;background:#26201a;place-self:center;visibility:hidden}
.die.six{box-shadow:inset 0 -6px 0 #d9cfbd,0 0 0 4px var(--gold),0 8px 24px rgba(234,184,75,.45)}
.whose{text-align:center;font-weight:700}
.whose b{font-family:var(--display);font-size:1.35rem;display:block}
.manual{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.manual button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:8px;padding:6px 0;font-weight:700;font-variant-numeric:tabular-nums}
.msg{background:rgba(234,184,75,.14);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.6rem;font-weight:800}
.log{font-size:.82rem;color:var(--muted);display:grid;gap:2px;max-height:150px;overflow:auto}

/* forms */
form.gf{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.lbl{font-weight:600;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem}
input[type=text],input[type=url],input[type=number],textarea,select{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical;font-size:.85rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--felt-deep);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--gold)}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.3)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.preview{display:grid;place-items:center;min-height:180px;background:rgba(0,0,0,.22);border-radius:18px;border:2px dashed rgba(255,255,255,.12)}
.photo-prev{width:72px;height:72px;border-radius:10px;object-fit:cover}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;word-break:break-all;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;max-height:120px;overflow:auto}

.plist{display:grid;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pitem .grow{flex:1;min-width:0}
.ship{display:grid;gap:8px;padding:0;margin:0}
.ship li{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ship ul{padding:0;margin:0}
.flag{font-size:.8rem;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--felt-deep);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);display:grid;gap:10px}
.modal .opts{display:grid;gap:6px}
.modal .opts button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 12px;font-weight:600}
.big-end{text-align:center;padding:22px;border-radius:18px;background:rgba(224,82,91,.15);border:1px solid rgba(224,82,91,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading the table…</p></div>
<script type="module">
/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
   Firebase console → Project settings → General → Your apps → Web app
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDENYEMCCuznYZBaBdLgiTcOUuhxb1Uq6c",
  authDomain: "christmas-white-elephant.firebaseapp.com",
  projectId: "christmas-white-elephant",
  storageBucket: "christmas-white-elephant.firebasestorage.app",
  messagingSenderId: "28405498639",
  appId: "1:28405498639:web:beacf01fc566958736f47a"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const COLORS={
  red:{c1:"#b8242f",c2:"#efe1c8",rib:"#f2c14e",label:"Red"},
  green:{c1:"#1f6b45",c2:"#d7e8c9",rib:"#e0525b",label:"Green"},
  gold:{c1:"#d9a63a",c2:"#fff1c9",rib:"#7b1e2b",label:"Gold"},
  blue:{c1:"#22477a",c2:"#cfe0f5",rib:"#f4f1ea",label:"Blue"},
  pink:{c1:"#d2668a",c2:"#ffe0ea",rib:"#2f6b4f",label:"Pink"},
  silver:{c1:"#c4c8d0",c2:"#ffffff",rib:"#b8242f",label:"Silver"}
};
const PATTERNS={stripes:"Candy stripes",dots:"Polka dots",check:"Check",confetti:"Confetti",plain:"Shiny plain",kraft:"Brown paper & string"};
const SIZES={s:"Small box",m:"Medium box",l:"Big box",long:"Long & flat",tall:"Tall"};
const STORES={uk:"Amazon UK",us:"Amazon US",other:"Another shop"};
const COUNTRY={uk:"UK",us:"US"};

const S={fs:null,uid:null,isHost:false,hostClaim:false,local:false,stateExists:false,loaded:false,
  parcels:{},contents:{},game:null,
  ui:{showTime:false,move:null,rolling:false,face:6,toast:"",draft:null,saved:false,saving:false},
  undo:[]};

function defaultGame(){return {phase:"setup",order:[],turn:0,hold:{},opened:{},awaiting:"",grabDone:false,
  settings:{budget:"£20 / $25",passLeft:true,minMin:5,maxMin:10},timerStart:0,timerEnd:0,last:0,log:[]};}
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeUrl(u){try{const x=new URL(u);return (x.protocol==="https:"||x.protocol==="http:")?x.href:"";}catch(e){return "";}}
function toast(t){S.ui.toast=t;renderToast();clearTimeout(toast._t);toast._t=setTimeout(()=>{S.ui.toast="";renderToast();},3500);}
function pageLink(){return location.href.split("#")[0].split("?")[0];}

/* ---------- derived ---------- */
function gift(id){return Object.assign({},S.parcels[id]||{},S.contents[id]||{});}
function giftIds(){return Object.keys(S.parcels).sort((a,b)=>(S.parcels[a].createdAt||0)-(S.parcels[b].createdAt||0));}
function order(){
  const g=S.game; const ids=giftIds();
  if(g.phase==="setup"){const o=(g.order||[]).filter(id=>S.parcels[id]);ids.forEach(id=>{if(!o.includes(id))o.push(id);});return o;}
  return (g.order||[]).filter(id=>S.parcels[id]);
}
function nameOf(id){return (S.parcels[id]&&S.parcels[id].name)||"Someone";}
function numOf(id){return order().indexOf(id)+1;}
function holder(p){return (S.game.hold||{})[p]||"";}
function current(){const o=order();return o.length?o[(S.game.turn||0)%o.length]:"";}
function inMiddle(){return order().filter(p=>!holder(p));}
function heldBy(pl){return order().filter(p=>holder(p)===pl);}

/* ---------- persistence ---------- */
let writing=false,pending=null;
function persist(){if(S.local||!S.fs)return;pending=clone(S.game);if(!writing)flush();}
async function flush(){
  writing=true;
  while(pending){const d=pending;pending=null;
    try{await setDoc(doc(S.fs,"state","main"),d);}catch(e){toast("Couldn't save the table. Check your connection and try again.");}
  }
  writing=false;
}
function change(fn,log){
  if(!S.isHost)return;
  S.undo.push(clone(S.game)); if(S.undo.length>40)S.undo.shift();
  const g=clone(S.game); fn(g);
  if(log){g.log=[log].concat(g.log||[]).slice(0,12);}
  S.game=g; render(); persist();
}
function undo(){if(!S.undo.length)return;S.game=S.undo.pop();render();persist();}

/* ---------- game actions ---------- */
function startGame(){
  const o=order(); if(o.length<2){toast("You need at least 2 gifts to start.");return;}
  change(g=>{g.order=o;g.hold={};g.opened={};g.turn=0;g.phase="grab";g.awaiting="";g.grabDone=false;g.last=0;},"Round 1 started: roll a 6 to grab a parcel.");
}
function shuffleOrder(){
  const o=order(); for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}
  change(g=>{g.order=o;},"Seating order shuffled.");
}
function startSteal(){
  const s=S.game.settings; const lo=Math.max(1,+s.minMin||5), hi=Math.max(lo,+s.maxMin||lo);
  const ms=Math.round((lo+Math.random()*(hi-lo))*60000);
  change(g=>{g.phase="steal";g.awaiting="";g.timerStart=Date.now();g.timerEnd=Date.now()+ms;},"Round 2 started: the hidden timer is running. Roll a 6 to steal.");
}
function endRound(auto){
  if(auto)chime();
  change(g=>{g.phase="reveal";g.awaiting="";},auto?"Time's up! Unwrap time.":"Steal round ended. Unwrap time.");
}
function roll(n){
  const g=S.game; if(!(g.phase==="grab"||g.phase==="steal")||g.awaiting)return;
  const cur=current(), who=nameOf(cur);
  if(g.phase==="grab"){
    if(n===6&&inMiddle().length){change(x=>{x.last=6;x.awaiting="pick";},who+" rolled a 6!");}
    else change(x=>{x.last=n;x.turn=(x.turn+1)%order().length;},who+" rolled a "+n+".");
  }else{
    const others=order().filter(p=>holder(p)&&holder(p)!==cur);
    if(n===6&&others.length){change(x=>{x.last=6;x.awaiting="steal";},who+" rolled a 6! Time to steal.");}
    else if(n===3&&g.settings.passLeft&&order().some(p=>holder(p))){
      change(x=>{const o=order();const nh={};Object.keys(x.hold).forEach(p=>{const h=x.hold[p];if(h){nh[p]=o[(o.indexOf(h)+1)%o.length];}});x.hold=nh;x.last=3;x.turn=(x.turn+1)%o.length;},who+" rolled a 3: everyone passes their parcels to the next person!");
    }
    else change(x=>{x.last=n;x.turn=(x.turn+1)%order().length;},who+" rolled a "+n+".");
  }
}
function virtualRoll(){
  if(S.ui.rolling)return; S.ui.rolling=true;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const final=1+Math.floor(Math.random()*6); let k=reduce?0:9;
  const tick=()=>{ if(k-->0){S.ui.face=1+Math.floor(Math.random()*6);drawDie();setTimeout(tick,60);} else {S.ui.face=final;S.ui.rolling=false;roll(final);} };
  tick();
}
function clickParcel(p){
  const g=S.game;
  if(g.phase==="reveal"){ if(S.isHost&&!g.opened[p])change(x=>{x.opened[p]=true;},nameOf(holder(p))+" unwrapped parcel "+numOf(p)+"."); return; }
  if(!S.isHost)return;
  const cur=current();
  if(g.awaiting==="pick"){
    if(holder(p)){toast("Pick a parcel from the middle.");return;}
    change(x=>{x.hold[p]=cur;x.awaiting="";x.turn=(x.turn+1)%order().length;if(order().every(q=>x.hold[q]))x.grabDone=true;},nameOf(cur)+" grabbed parcel "+numOf(p)+".");
    return;
  }
  if(g.awaiting==="steal"){
    const h=holder(p); if(!h||h===cur){toast("Pick a parcel someone else is holding.");return;}
    change(x=>{x.hold[p]=cur;x.awaiting="";x.turn=(x.turn+1)%order().length;},nameOf(cur)+" stole parcel "+numOf(p)+" from "+nameOf(h)+"!");
    return;
  }
  if(g.phase==="grab"||g.phase==="steal"){S.ui.move=p;renderModal();}
}
function moveTo(p,dest){
  S.ui.move=null;renderModal();
  change(x=>{if(dest)x.hold[p]=dest;else delete x.hold[p];if(x.phase==="grab")x.grabDone=order().every(q=>x.hold[q]);},"Host moved parcel "+numOf(p)+" to "+(dest?nameOf(dest):"the middle")+".");
}
function newGame(){
  change(g=>{const keep={settings:g.settings,hostUid:g.hostUid};Object.assign(g,defaultGame(),keep);},"New game: back to setup.");
}

/* ---------- sound ---------- */
let actx=null;
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}return actx;}
function chime(){const a=audio();if(!a)return;try{const t=a.currentTime;[784,988,1175,1568].forEach((f,i)=>{const o=a.createOscillator(),gn=a.createGain();o.type="triangle";o.frequency.value=f;gn.gain.setValueAtTime(0,t+i*.16);gn.gain.linearRampToValueAtTime(.25,t+i*.16+.02);gn.gain.exponentialRampToValueAtTime(.001,t+i*.16+.6);o.connect(gn).connect(a.destination);o.start(t+i*.16);o.stop(t+i*.16+.7);});}catch(e){}}

/* ---------- photo ---------- */
function shrinkSrc(src,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q));};img.onerror=()=>rej(new Error("That file isn't an image I can read."));img.src=src;});}
function shrinkPhoto(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("Couldn't read that image."));r.onload=()=>{shrinkSrc(r.result,max,q).then(res,rej);};r.readAsDataURL(file);});}

/* ---------- render helpers ---------- */
function parcelHTML(id,g,opts){
  opts=opts||{}; const col=COLORS[g.color]||COLORS.red;
  const cls=["parcel","sz-"+(SIZES[g.size]?g.size:"m"),"pat-"+(PATTERNS[g.pattern]?g.pattern:"stripes")];
  if(opts.static)cls.push("static"); if(opts.target)cls.push("target");
  const label=opts.label||("Parcel "+(opts.num||""));
  const tag=opts.num?`<span class="tag">${opts.num}</span>`:"";
  const inner=`<span class="rv"></span><span class="rh"></span><span class="bow"></span>${tag}`;
  const style=`--c1:${col.c1};--c2:${col.c2};--rib:${col.rib}`;
  if(opts.static)return `<span class="${cls.join(" ")}" style="${style}" role="img" aria-label="${esc(label)}">${inner}</span>`;
  return `<button type="button" class="${cls.join(" ")}" style="${style}" data-parcel="${esc(id)}" aria-label="${esc(label)}">${inner}</button>`;
}
function giftCard(p){
  const g=gift(p); const url=safeUrl(g.link||"");
  if(!g.title)return `<div class="gift"><span class="ph">…</span><div><div class="t">Unwrapping…</div><div class="m">No. ${numOf(p)} · from ${esc(g.name)}</div></div></div>`;
  const photo=(typeof g.photo==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(g.photo))?g.photo:"";
  const pic=photo?`<img src="${photo}" alt="">`:`<span class="ph">${esc(g.title.trim().charAt(0).toUpperCase()||"?")}</span>`;
  return `<div class="gift">${pic}<div><div class="t">${esc(g.title)}</div><div class="m">No. ${numOf(p)} · from ${esc(g.name)} · ${esc(STORES[g.store]||"")}</div>${url?`<a href="${esc(url)}" target="_blank" rel="noopener">See it online</a>`:""}</div></div>`;
}
function pipLayout(n){return {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[];}
function dieHTML(n){const on=pipLayout(n);let s="";for(let i=0;i<9;i++)s+=`<i style="${on.includes(i)?"visibility:visible":""}"></i>`;return `<div class="die${n===6?" six":""}" id="die" role="img" aria-label="Die showing ${n}">${s}</div>`;}
function drawDie(){const d=document.getElementById("die");if(d)d.outerHTML=dieHTML(S.ui.face);}
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+":"+String(s).padStart(2,"0");}

/* ---------- views ---------- */
function view(){const h=location.hash.replace("#","");if(h==="add-gift"||h==="table"||h==="how-to-play")return h;return S.isHost?"table":"add-gift";}

function render(){
  const app=document.getElementById("app");
  if(!S.loaded){app.innerHTML=`<p class="sub">Loading the table…</p>`;return;}
  const top=`<header class="top"><div><h1>Christmas Parcel Steal</h1><p class="sub">Roll a 6 to grab. Roll a 6 to steal. Keep whatever you're holding when the timer goes.</p></div>`;
  if(!S.stateExists){app.innerHTML=`${top}</header>${createView()}`;bind();return;}
  const v=view();
  const nav=`<nav class="tabs" aria-label="Sections"><a href="#table" ${v==="table"?'aria-current="page"':""}>Game table</a><a href="#add-gift" ${v==="add-gift"?'aria-current="page"':""}>Add my gift</a><a href="#how-to-play" ${v==="how-to-play"?'aria-current="page"':""}>Rules</a></nav>`;
  let body=v==="table"?tableView():v==="add-gift"?submitView():rulesView();
  const demo=S.local?`<div class="banner">Demo mode with example gifts. Paste your Firebase config at the top of this file to play for real.</div>`:"";
  app.innerHTML=`${top}${nav}</header>${demo}${body}`;
  bind(); renderModal();
}

function createView(){
  return `<section class="panel" style="max-width:520px"><h2>Set up this year's game</h2>
  <p class="sub">Whoever does this becomes the host. Choose a host PIN, so you can also run the table from another device later.</p>
  <form class="gf" id="createForm" novalidate>
    <div class="field"><label for="c-pin">Host PIN</label><input id="c-pin" type="text" inputmode="numeric" minlength="4" maxlength="12" autocomplete="off" placeholder="At least 4 characters"></div>
    <div class="field"><label for="c-budget">Spending limit</label><input id="c-budget" type="text" value="£20 / $25"></div>
    <button class="btn" type="submit">Create the game</button>
  </form></section>`;
}

function phaseLabel(g){return {setup:"Setting up",grab:"Round 1 · Grab",steal:"Round 2 · Steal",reveal:"Unwrap & reveal"}[g.phase];}

function tableView(){
  const g=S.game, o=order(), cur=current();
  const live=(g.phase==="grab"||g.phase==="steal");
  const mid=inMiddle();
  const midHTML=mid.length?mid.map(p=>parcelHTML(p,S.parcels[p],{num:numOf(p),target:g.awaiting==="pick",static:!S.isHost||g.phase==="setup"})).join(""):`<p class="empty">${g.phase==="setup"?"No gifts yet. Send friends the link so they can add theirs.":"The middle is empty."}</p>`;
  const seats=o.map(pl=>{
    const mine=heldBy(pl), isTurn=live&&pl===cur;
    let inner;
    if(g.phase==="reveal"){
      inner=mine.length?mine.map(p=>g.opened[p]?giftCard(p):parcelHTML(p,S.parcels[p],{num:numOf(p),label:"Unwrap parcel "+numOf(p),target:S.isHost,static:!S.isHost})).join(""):`<p class="empty">Nothing this time. Sort a swap on the call!</p>`;
    }else{
      const tgt=g.awaiting==="steal"&&pl!==cur;
      inner=mine.length?mine.map(p=>parcelHTML(p,S.parcels[p],{num:numOf(p),target:tgt,static:!S.isHost})).join(""):`<p class="empty">${g.phase==="setup"?"Waiting to play":"No parcels yet"}</p>`;
    }
    return `<section class="seat${isTurn?" turn":""}" aria-label="${esc(nameOf(pl))}"><div class="nm"><span>${esc(nameOf(pl))}</span>${isTurn?'<span class="turnflag">Rolling</span>':`<span class="count">${mine.length} parcel${mine.length===1?"":"s"}</span>`}</div><div class="pile mini" style="${g.phase==="reveal"?"display:grid;gap:8px":""}">${inner}</div></section>`;
  }).join("");
  const middle=g.phase==="reveal"&&!mid.length?"":`<section class="middle" aria-label="The middle"><div class="hd"><h2>The middle</h2><span class="pill">${mid.length} of ${o.length} parcels</span></div><div class="pile">${midHTML}</div></section>`;
  const main=`<div style="display:grid;gap:16px">${g.phase==="setup"&&S.isHost?setupPanel():""}${g.phase==="reveal"?revealHead():""}${middle}<div class="seats">${seats||'<p class="empty">Players appear here as they add gifts.</p>'}</div>${g.phase==="reveal"?shippingList():""}</div>`;
  return `<div class="game">${main}${rail()}</div>`;
}

function rail(){
  const g=S.game, cur=current(), live=g.phase==="grab"||g.phase==="steal";
  let c=`<div class="row"><span class="pill${live?" live":""}">${phaseLabel(g)}</span>${S.isHost?'<span class="pill">You\'re the host</span>':""}</div>`;
  if(live){
    let msg="";
    if(g.awaiting==="pick")msg=`${esc(nameOf(cur))}, choose a parcel from the middle.`;
    else if(g.awaiting==="steal")msg=`${esc(nameOf(cur))}, choose a parcel to steal.`;
    else if(g.phase==="grab"&&g.grabDone)msg=`Every parcel has been grabbed.`;
    c+=`<div class="whose">${g.awaiting?"Choosing":"Next to roll"}<b>${esc(nameOf(cur))}</b></div>${dieHTML(S.ui.rolling?S.ui.face:(g.last||S.ui.face||6))}`;
    if(msg)c+=`<div class="msg" role="status">${msg}</div>`;
    if(S.isHost){
      if(g.phase==="grab"&&g.grabDone)c+=`<button class="btn" data-act="steal">Start the steal round</button>`;
      else if(!g.awaiting)c+=`<button class="btn" data-act="roll" ${S.ui.rolling?"disabled":""}>Roll for ${esc(nameOf(cur))}</button><div class="lbl">Rolled a real die? Tap the number:</div><div class="manual">${[1,2,3,4,5,6].map(n=>`<button data-roll="${n}" aria-label="Rolled ${n}">${n}</button>`).join("")}</div>`;
      else c+=`<button class="btn alt sm" data-act="skip">Cancel this pick</button>`;
    }
    if(g.phase==="steal"){
      c+=`<div class="panel" style="padding:12px;gap:6px"><div class="lbl">Hidden timer</div>${S.ui.showTime?`<div class="timer" id="timeleft">${fmt(g.timerEnd-Date.now())}</div>`:`<div class="sub">Running. Nobody knows when it ends.</div>`}${S.isHost?`<div class="row"><button class="btn alt sm" data-act="peek">${S.ui.showTime?"Hide":"Peek at"} time left</button><button class="btn red sm" data-act="end">End round now</button></div>`:""}</div>`;
    }
    if(S.isHost)c+=`<div class="row"><button class="btn alt sm" data-act="undo" ${S.undo.length?"":"disabled"}>Undo</button></div><p class="hint">Tap any parcel to move it by hand.</p>`;
  }else if(g.phase==="setup"){
    c+=`<p class="sub">${S.isHost?"When everyone has added a gift, press Start.":"The host will start the game on the video call."}</p>`;
  }else{
    c+=`<p class="sub">${S.isHost?"Tap each parcel to unwrap it, one person at a time.":"The host is unwrapping the parcels."}</p>${S.isHost?`<button class="btn alt sm" data-act="openall">Unwrap everything</button><button class="btn alt sm" data-act="undo" ${S.undo.length?"":"disabled"}>Undo</button><button class="btn alt sm" data-act="new">Start a new game</button>`:""}`;
  }
  if((g.log||[]).length)c+=`<div><div class="lbl">What happened</div><div class="log" aria-live="polite">${g.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>`;
  return `<aside class="rail"><div class="panel">${c}</div></aside>`;
}

function setupPanel(){
  const s=S.game.settings, list=order();
  const items=list.map(p=>{const g=S.parcels[p];return `<div class="pitem"><span class="mini">${parcelHTML(p,g,{static:true,num:numOf(p)})}</span><div class="grow"><b>${esc(g.name)}</b><div class="hint">Gift added · delivers to the ${COUNTRY[g.country]||"UK"}</div></div><button class="btn alt sm" data-remove="${esc(p)}" aria-label="Remove ${esc(g.name)}'s gift">Remove</button></div>`;}).join("");
  return `<section class="panel" aria-label="Setup"><div class="row" style="justify-content:space-between"><h2>Before the call</h2><span class="pill">${list.length} gift${list.length===1?"":"s"} in</span></div>
  <p class="sub">Send everyone this link. They add their gift on the “Add my gift” tab, and no account is needed. What's inside stays locked until the reveal, even for you.</p>
  <div class="row"><div class="code" style="flex:1;min-width:0">${esc(pageLink())}</div><button class="btn alt sm" data-act="copylink">Copy link</button></div>
  <div class="plist">${items||'<p class="empty">No gifts yet.</p>'}</div>
  <div class="row" style="gap:14px;align-items:end">
    <div class="field" style="flex:1;min-width:140px"><label for="budget">Spending limit</label><input id="budget" type="text" value="${esc(s.budget)}"></div>
    <div class="field" style="width:110px"><label for="minMin">Timer from (min)</label><input id="minMin" type="number" min="1" max="60" value="${esc(s.minMin)}"></div>
    <div class="field" style="width:110px"><label for="maxMin">to (min)</label><input id="maxMin" type="number" min="1" max="60" value="${esc(s.maxMin)}"></div>
  </div>
  <label class="row" style="gap:8px"><input type="checkbox" id="passLeft" ${s.passLeft?"checked":""}> In the steal round, a 3 means everyone passes their parcels to the next person</label>
  <div class="row"><button class="btn" data-act="start" ${list.length<2?"disabled":""}>Start the game</button><button class="btn alt" data-act="shuffle" ${list.length<2?"disabled":""}>Shuffle who goes first</button></div></section>`;
}

function revealHead(){return `<div class="big-end"><h2>Unwrap time!</h2><p class="sub">Whatever you're holding is yours. The list at the bottom says who posts what to whom.</p></div>`;}

function shipNote(p){
  const g=gift(p), win=holder(p), wc=(S.parcels[win]&&S.parcels[win].country)||"uk";
  if(win===p)return "Kept their own gift! No posting needed.";
  if(g.store==="other")return `Check it delivers to the ${COUNTRY[wc]}.`;
  if(g.store&&g.store!==wc)return `${nameOf(win)} lives in the ${COUNTRY[wc]}, so buy the same thing from Amazon ${COUNTRY[wc]}.`;
  return `Order from ${STORES[g.store]||"Amazon"} straight to ${nameOf(win)}'s address.`;
}
function shippingList(){
  const g=S.game, o=order();
  const rows=o.filter(p=>holder(p)).map(p=>{
    const gg=gift(p), win=holder(p);
    if(!g.opened[p]||!gg.title)return `<li>Parcel ${numOf(p)} → ${esc(nameOf(win))} <span class="hint">(unwrap it to see)</span></li>`;
    return `<li><b>${esc(nameOf(p))}</b> sends “${esc(gg.title)}” to <b>${esc(nameOf(win))}</b><div class="flag">${esc(shipNote(p))}</div></li>`;
  }).join("");
  const none=o.filter(pl=>!heldBy(pl).length).map(nameOf);
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Who posts what</h2><button class="btn alt sm" data-act="copy">Copy list</button></div><ul class="ship">${rows||'<li class="empty">Nothing to post.</li>'}</ul>${none.length?`<p class="sub">Ended with nothing: ${none.map(esc).join(", ")}. Anyone with spares can share!</p>`:""}</section>`;
}
function shippingText(){
  const g=S.game;return order().filter(p=>holder(p)&&g.opened[p]&&gift(p).title).map(p=>{const gg=gift(p),win=holder(p);
    if(win===p)return `${nameOf(p)} keeps their own gift: ${gg.title}`;
    return `${nameOf(p)} sends "${gg.title}" to ${nameOf(win)}: ${shipNote(p)}${safeUrl(gg.link||"")?" "+safeUrl(gg.link):""}`;}).join("\n");
}

function submitView(){
  const g=S.game, mine=S.uid&&S.parcels[S.uid]?gift(S.uid):null;
  if(!S.ui.draft)S.ui.draft=mine?clone(mine):{name:"",title:"",store:"uk",country:"uk",link:"",pattern:"stripes",color:"red",size:"m"};
  const d=S.ui.draft;
  if(g.phase!=="setup"){
    return `<section class="panel"><h2>The game has started</h2><p class="sub">Gifts are locked now. Head to the game table to watch along.</p>${mine?`<div class="preview">${parcelHTML("me",mine,{static:true,label:"Your parcel"})}</div>`:""}</section>`;
  }
  const radios=(name,map,val,swatch)=>`<div class="seg" role="radiogroup">${Object.entries(map).map(([k,v])=>`<label><input type="radio" name="${name}" value="${k}" ${val===k?"checked":""}>${swatch?`<span class="swatch" style="background:${COLORS[k].c1}"></span>${esc(v.label)}`:esc(v)}</label>`).join("")}</div>`;
  const saved=S.ui.saved?`<div class="msg" role="status">Saved! Your parcel is in the middle of the table. You can change it until the game starts, from this same phone or computer.</div>`:"";
  return `<div class="two"><section class="panel"><h2>Add your gift</h2>
  <p class="sub">Spending limit: <b>${esc(g.settings.budget)}</b>. Pick something from Amazon UK or US, then wrap it. Nobody sees what's inside until the reveal, and you only buy it once you know who won it.</p>
  ${saved}
  <form class="gf" id="giftForm" novalidate>
    <div class="field"><label for="f-name">Your name</label><input id="f-name" type="text" maxlength="40" required value="${esc(d.name)}" placeholder="e.g. Gabs"></div>
    <div class="field"><span class="lbl">Where should a gift be delivered to you?</span>${radios("country",{uk:"UK",us:"US"},d.country)}</div>
    <div class="field"><label for="f-title">What's the gift?</label><input id="f-title" type="text" maxlength="120" required value="${esc(d.title)}" placeholder="e.g. Fuzzy reindeer bed socks"></div>
    <div class="field"><span class="lbl">Where is it from?</span>${radios("store",STORES,d.store)}</div>
    <div class="field"><label for="f-link">Link to it</label><input id="f-link" type="url" value="${esc(d.link)}" placeholder="https://www.amazon.co.uk/…"><span class="hint">Paste the product page, so the winner can see it.</span></div>
    <div class="field"><label for="f-photo">Photo (optional)</label><div class="row">${d.photo?`<img class="photo-prev" src="${d.photo}" alt="Your gift photo">`:""}<input id="f-photo" type="file" accept="image/*"></div><span class="hint">A screenshot of the product works well.</span></div>
    <div class="field"><span class="lbl">Wrapping paper</span>${radios("pattern",PATTERNS,d.pattern)}</div>
    <div class="field"><span class="lbl">Colour</span>${radios("color",COLORS,d.color,true)}</div>
    <div class="field"><span class="lbl">Parcel shape</span>${radios("size",SIZES,d.size)}<span class="hint">It doesn't have to match the real thing. Bluffing is allowed.</span></div>
    <div class="row"><button class="btn" type="submit" ${S.ui.saving?"disabled":""}>${S.ui.saving?"Saving…":mine?"Update my gift":"Put it under the tree"}</button></div>
  </form></section>
  <aside class="rail"><div class="panel"><h3>Your parcel</h3><div class="preview">${parcelHTML("preview",d,{static:true,label:"Preview of your parcel"})}</div><p class="hint">This is how it'll look on the table.</p></div></aside></div>`;
}

function rulesView(){
  const s=S.game.settings;
  const hostBox=S.isHost||S.local?"":`<section class="panel" style="max-width:68ch"><h3>Hosting from this device?</h3><p class="sub">Enter the host PIN to run the table here.</p><form class="row" id="claimForm" novalidate><input id="claim-pin" type="text" autocomplete="off" inputmode="numeric" style="max-width:180px" aria-label="Host PIN" placeholder="Host PIN"><button class="btn sm" type="submit">Become host</button></form></section>`;
  return `<section class="panel" style="max-width:68ch"><h2>How to play</h2>
  <p><b>Before the call.</b> Everyone adds one gift (up to ${esc(s.budget)}) on the “Add my gift” tab and wraps it on screen. Don't buy anything yet.</p>
  <p><b>Round 1: Grab.</b> The host shares the game table on the video call. Take turns rolling, with a real die on camera or the on-screen one. Roll a 6 and you take a parcel from the middle. Keep going until the middle is empty.</p>
  <p><b>Round 2: Steal.</b> A hidden timer starts (somewhere between ${esc(s.minMin)} and ${esc(s.maxMin)} minutes). Roll a 6 and you steal any parcel from anyone.${s.passLeft?" Roll a 3 and everyone passes all their parcels to the next person.":""}</p>
  <p><b>Unwrap.</b> When the timer goes, you keep what you're holding. The host unwraps each parcel to show the gift and who chose it.</p>
  <p><b>After the call.</b> Everyone orders the gift they chose and sends it to whoever won it. If the winner lives in the other country, buy the same thing from their local Amazon.</p></section>${hostBox}`;
}

/* ---------- modal & toast ---------- */
function renderModal(){
  let m=document.getElementById("modal"); if(m)m.remove();
  const p=S.ui.move; if(!p||!S.parcels[p])return;
  const opts=[`<button data-moveto="">The middle</button>`].concat(order().map(pl=>`<button data-moveto="${esc(pl)}">${esc(nameOf(pl))}${holder(p)===pl?" (has it now)":""}</button>`)).join("");
  m=document.createElement("div");m.id="modal";m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="mvh"><h3 id="mvh">Move parcel ${numOf(p)} to…</h3><div class="opts">${opts}</div><button class="btn alt sm" data-act="closemove">Cancel</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{const b=e.target.closest("[data-moveto]");if(b){moveTo(p,b.getAttribute("data-moveto"));return;}if(e.target===m||e.target.closest('[data-act="closemove"]')){S.ui.move=null;renderModal();}});
  const first=m.querySelector("button");if(first)first.focus();
}
function renderToast(){let t=document.getElementById("toast");if(!S.ui.toast){if(t)t.remove();return;}if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=S.ui.toast;}

/* ---------- events ---------- */
function readDraft(){
  const f=document.getElementById("giftForm"); if(!f)return;
  const d=S.ui.draft;
  d.name=f.querySelector("#f-name").value.trim(); d.title=f.querySelector("#f-title").value.trim(); d.link=f.querySelector("#f-link").value.trim();
  ["country","store","pattern","color","size"].forEach(n=>{const r=f.querySelector(`input[name="${n}"]:checked`);if(r)d[n]=r.value;});
}
function validDraft(){const d=S.ui.draft;if(!d.name)return "Add your name.";if(!d.title)return "Say what the gift is.";if(d.link&&!safeUrl(d.link))return "That link doesn't look right. It should start with https://";return "";}
function bind(){
  const app=document.getElementById("app");
  app.querySelectorAll("[data-parcel]").forEach(b=>b.addEventListener("click",()=>clickParcel(b.getAttribute("data-parcel"))));
  app.querySelectorAll("[data-roll]").forEach(b=>b.addEventListener("click",()=>{audio();S.ui.face=+b.getAttribute("data-roll");roll(S.ui.face);}));
  app.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>removeGift(b.getAttribute("data-remove"))));
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>act(b.getAttribute("data-act"))));
  const f=document.getElementById("giftForm");
  if(f){
    f.addEventListener("input",e=>{readDraft();S.ui.saved=false;if(e.target.type==="radio"){render();}else{const pv=document.querySelector(".preview");if(pv)pv.innerHTML=parcelHTML("preview",S.ui.draft,{static:true,label:"Preview of your parcel"});}});
    f.addEventListener("submit",e=>{e.preventDefault();saveGift();});
    const ph=f.querySelector("#f-photo");
    ph.addEventListener("change",async()=>{const file=ph.files&&ph.files[0];if(!file)return;try{readDraft();S.ui.draft.photo=await shrinkPhoto(file,320,.72);render();}catch(err){toast(err.message);}});
  }
  const cf=document.getElementById("createForm"); if(cf)cf.addEventListener("submit",e=>{e.preventDefault();createGame();});
  const kf=document.getElementById("claimForm"); if(kf)kf.addEventListener("submit",e=>{e.preventDefault();claimHost();});
  ["budget","minMin","maxMin"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>change(g=>{g.settings[id]=id==="budget"?el.value.trim().slice(0,30):Math.max(1,Math.min(60,+el.value||5));}));});
  const pl=document.getElementById("passLeft"); if(pl)pl.addEventListener("change",()=>change(g=>{g.settings.passLeft=pl.checked;}));
}
async function copyText(t,ok){try{await navigator.clipboard.writeText(t);toast(ok);}catch(e){toast("Couldn't copy. Select the text and copy it instead.");}}
function act(a){
  audio();
  if(a==="start")startGame();
  else if(a==="shuffle")shuffleOrder();
  else if(a==="roll")virtualRoll();
  else if(a==="steal")startSteal();
  else if(a==="end")endRound(false);
  else if(a==="undo")undo();
  else if(a==="skip")change(g=>{g.awaiting="";g.turn=(g.turn+1)%order().length;},"Pick cancelled.");
  else if(a==="peek"){S.ui.showTime=!S.ui.showTime;render();}
  else if(a==="openall")change(g=>{order().forEach(p=>{if(holder(p))g.opened[p]=true;});},"Everything unwrapped!");
  else if(a==="new")newGame();
  else if(a==="copy")copyText(shippingText(),"Copied the posting list.");
  else if(a==="copylink")copyText(pageLink(),"Link copied. Send it to everyone!");
}

/* ---------- Firebase writes ---------- */
function splitGift(d,createdAt){
  const parcel={name:String(d.name||"").slice(0,40),country:COUNTRY[d.country]?d.country:"uk",pattern:PATTERNS[d.pattern]?d.pattern:"stripes",color:COLORS[d.color]?d.color:"red",size:SIZES[d.size]?d.size:"m",createdAt:createdAt};
  const content={title:String(d.title||"").slice(0,120),store:STORES[d.store]?d.store:"uk",link:safeUrl(d.link||"")};
  if(typeof d.photo==="string"&&/^data:image\/jpeg;base64,/.test(d.photo)&&d.photo.length<300000)content.photo=d.photo;
  return {parcel,content};
}
async function saveGift(){
  readDraft(); const err=validDraft(); if(err){toast(err);return;}
  const existing=S.parcels[S.uid];
  const {parcel,content}=splitGift(S.ui.draft,existing?existing.createdAt:Date.now());
  if(S.local){S.parcels["you"]=parcel;S.contents["you"]=content;S.ui.saved=true;render();return;}
  S.ui.saving=true;render();
  try{
    const b=writeBatch(S.fs);
    b.set(doc(S.fs,"parcels",S.uid),parcel);
    b.set(doc(S.fs,"contents",S.uid),content);
    await b.commit();
    S.contents[S.uid]=content; S.ui.saved=true;
  }catch(e){toast(e&&e.code==="permission-denied"?"Gifts are locked now that the game has started.":"Couldn't save just now. Check your connection and try again.");}
  S.ui.saving=false;render();
}
async function removeGift(id){
  if(!S.isHost)return; const nm=nameOf(id);
  if(S.local){delete S.parcels[id];delete S.contents[id];render();return;}
  try{const b=writeBatch(S.fs);b.delete(doc(S.fs,"parcels",id));b.delete(doc(S.fs,"contents",id));await b.commit();toast("Removed "+nm+"'s gift.");}catch(e){toast("Couldn't remove it.");}
}
async function createGame(){
  const pin=(document.getElementById("c-pin").value||"").trim();
  const budget=(document.getElementById("c-budget").value||"").trim().slice(0,30)||"£20 / $25";
  if(pin.length<4){toast("Choose a PIN with at least 4 characters.");return;}
  const g=defaultGame(); g.settings.budget=budget; g.hostUid=S.uid;
  try{const b=writeBatch(S.fs);b.set(doc(S.fs,"state","main"),g);b.set(doc(S.fs,"secret","host"),{pin:pin,uid:S.uid});await b.commit();toast("Game created. You're the host!");}
  catch(e){toast("Someone has already set up the game. Use the host PIN on the Rules tab.");}
}
async function claimHost(){
  const pin=(document.getElementById("claim-pin").value||"").trim(); if(!pin){toast("Enter the host PIN.");return;}
  try{await setDoc(doc(S.fs,"hosts",S.uid),{pin:pin});toast("You're the host on this device now.");location.hash="#table";}
  catch(e){toast("That PIN isn't right.");}
}

/* ---------- timer tick ---------- */
setInterval(()=>{
  const g=S.game; if(!g||g.phase!=="steal")return;
  if(S.ui.showTime){const t=document.getElementById("timeleft");if(t)t.textContent=fmt(g.timerEnd-Date.now());}
  if(S.isHost&&g.timerEnd&&Date.now()>=g.timerEnd)endRound(true);
},1000);
window.addEventListener("hashchange",()=>{S.ui.saved=false;render();});

/* ---------- demo ---------- */
function loadDemo(){
  S.local=true;S.isHost=true;S.stateExists=true;
  const t=Date.now();
  [["Amy","uk","Cosy cable-knit socks","uk","stripes","red","s"],["Gabs","uk","Mini waffle maker","uk","dots","green","l"],["Sam","us","Glow-in-the-dark star map","us","check","blue","long"],["Priya","uk","Hot sauce sampler","uk","kraft","red","m"],["Jo","us","Desk cactus that sings","us","confetti","pink","tall"]]
  .forEach((d,i)=>{S.parcels["demo"+i]={name:d[0],country:d[1],pattern:d[4],color:d[5],size:d[6],createdAt:t+i};S.contents["demo"+i]={title:d[2],store:d[3],link:""};});
  S.game=defaultGame();S.loaded=true;render();
}

/* ---------- boot ---------- */
let contentsUnsub=null, myContentUnsub=null;
function syncHost(){S.isHost=!!S.uid&&!!S.game&&(S.game.hostUid===S.uid||S.hostClaim);}
function watchContents(){
  // Everyone can read all gift contents only once the game reaches the reveal (enforced by the database rules).
  const reveal=S.game&&S.game.phase==="reveal";
  if(reveal&&!contentsUnsub){
    contentsUnsub=onSnapshot(collection(S.fs,"contents"),snap=>{const m={};snap.forEach(d=>{m[d.id]=d.data();});S.contents=m;render();},()=>{contentsUnsub=null;});
  }else if(!reveal&&contentsUnsub){contentsUnsub();contentsUnsub=null;S.contents={};if(S.uid&&S.myContent)S.contents[S.uid]=S.myContent;}
}
function boot(){
  if(!firebaseConfig.apiKey||firebaseConfig.apiKey==="PASTE_HERE"){loadDemo();return;}
  const app=initializeApp(firebaseConfig); const auth=getAuth(app); S.fs=getFirestore(app);
  const slow=setTimeout(()=>{if(!S.loaded){document.getElementById("app").innerHTML=`<p class="sub">Still connecting… If this doesn't load, check your internet connection and refresh.</p>`;}},10000);
  signInAnonymously(auth).catch(()=>{document.getElementById("app").innerHTML=`<p class="sub">Couldn't connect to the game. Refresh the page to try again.</p>`;});
  let started=false;
  onAuthStateChanged(auth,user=>{
    if(!user||started)return; started=true; S.uid=user.uid;
    let gotState=false,gotParcels=false;
    const ready=()=>{if(gotState&&gotParcels&&!S.loaded){S.loaded=true;clearTimeout(slow);render();}};
    onSnapshot(doc(S.fs,"state","main"),snap=>{
      gotState=true;
      if(writing||pending){ready();return;}
      S.stateExists=snap.exists();
      const d=snap.exists()?snap.data():null; const base=defaultGame();
      S.game=d?Object.assign(base,d,{settings:Object.assign(base.settings,d.settings||{})}):base;
      syncHost(); watchContents(); ready();
      if(S.loaded&&!(document.getElementById("giftForm")&&view()==="add-gift"&&S.game.phase==="setup"))render();
    },()=>{toast("Lost connection to the table. Refresh the page.");});
    onSnapshot(collection(S.fs,"parcels"),snap=>{
      const m={};snap.forEach(d=>{m[d.id]=d.data();});S.parcels=m;gotParcels=true;ready();
      if(S.loaded&&!(document.getElementById("giftForm")&&view()==="add-gift"))render();
    },()=>{gotParcels=true;ready();});
    onSnapshot(doc(S.fs,"hosts",S.uid),snap=>{S.hostClaim=snap.exists();syncHost();if(S.loaded)render();},()=>{});
    myContentUnsub=onSnapshot(doc(S.fs,"contents",S.uid),snap=>{
      let reset=false;if(snap.exists()){S.myContent=snap.data();S.contents[S.uid]=S.myContent;if(S.ui.draft&&!S.ui.draft.title){S.ui.draft=null;reset=true;}}
      if(S.loaded&&(reset||!document.getElementById("giftForm")))render();
    },()=>{});
  });
}
boot();
</script>
